name: build-kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "内核分支（如 android12-5.10-2025-12）"
        required: true
        default: "android12-5.10-2025-12"
      apply_mglru:
        description: "应用 patches/mglru/*.patch（MGLRU 补丁，需先在本地解决冲突）"
        type: boolean
        default: false
      apply_bbr3:
        description: "替换为 BBRv3（面向 6.x，可能编不过，默认关）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 腾出磁盘（内核编译约需 25GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      # 内核 5.10 与 clang 14/15 不兼容（GKI 5.10 当年用的是 AOSP clang-r416183b ≈ clang 12），
      # 所以这里明确装 clang-12 + lld-12，不要用系统默认 clang。
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip rsync python3 device-tree-compiler lz4 xz-utils zstd cpio kmod \
            git curl binutils pahole \
            clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          echo "== clang =="
          clang-12 --version | head -2
          echo "== 交叉编译器 =="
          aarch64-linux-gnu-gcc --version | head -1

      - name: 编译器冒烟测试
        run: |
          printf 'int x;\n' > /tmp/t.c
          clang-12 --target=aarch64-linux-gnu -c /tmp/t.c -o /tmp/t.o
          echo "clang-12 能正常编译 aarch64 目标"

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" \
            https://github.com/ztc1997/android_gki_kernel_5.10_common.git kernel
          cd kernel && git log -1 --format='%h %s'

      - name: 应用 MGLRU 补丁
        if: ${{ inputs.apply_mglru }}
        run: |
          shopt -s nullglob
          ps=("$GITHUB_WORKSPACE"/patches/mglru/*.patch)
          if [ ${#ps[@]} -eq 0 ]; then
            echo "::error::patches/mglru 里没有补丁"
            exit 1
          fi
          cd kernel
          for p in "${ps[@]}"; do
            echo ">> 应用 $(basename "$p")"
            git am --3way "$p" || { echo "::error::补丁失败 $(basename "$p")"; exit 1; }
          done

      - name: 产前检查（确认原有功能仍在，绝不删功能）
        run: |
          cd kernel
          echo "== kcompressd =="
          grep -rn "kcompressd" mm/vmscan.c drivers/block/zram/ 2>/dev/null | head -5 || echo "  未找到（该分支可能早于 2025-10）"
          echo "== zstd =="
          ls crypto/zstd.c lib/zstd/ >/dev/null 2>&1 && echo "  有" || echo "  无"
          echo "== teo / ssg / schedhorizon =="
          ls drivers/cpuidle/governors/teo.c 2>/dev/null
          grep -rln "ssg" block/ drivers/block/ 2>/dev/null | head -3
          grep -rln "schedhorizon" kernel/sched/ 2>/dev/null | head -3
          echo "== defconfig =="
          ls arch/arm64/configs/gki_defconfig

      - name: 修改内核配置（只动十几个符号，不删功能）
        run: bash scripts/patch-config.sh kernel

      - name: BBRv3 替换
        if: ${{ inputs.apply_bbr3 }}
        run: bash scripts/patch-bbrv3.sh kernel

      # 这个 fork 里没有 build/ 子模块（build.sh 在 kernel/build 仓库里），
      # 所以不走 build/build.sh，直接用 make。
      - name: 编译
        run: |
          set -o pipefail
          cd kernel

          export ARCH=arm64
          export CC=clang-12
          export LD=ld.lld-12
          export AR=llvm-ar-12
          export NM=llvm-nm-12
          export OBJCOPY=llvm-objcopy-12
          export OBJDUMP=llvm-objdump-12
          export STRIP=llvm-strip-12
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out gki_defconfig

          # 关掉 KMI 符号裁剪：TRIM_UNUSED_KSYMS 需要 build/abi 脚本生成白名单，
          # 没有 build.sh 时开着会裁掉 vendor 依赖的导出符号，导致 vendor_dlkm 的 .ko 加载失败。
          # LOCALVERSION_AUTO 关掉，避免浅克隆导致版本号异常。
          ./scripts/config --file out/.config -d TRIM_UNUSED_KSYMS -d LOCALVERSION_AUTO
          make O=out olddefconfig

          if ! make O=out -j"$(nproc)" Image 2>&1 | tee /tmp/build.log; then
            echo "::error::编译失败，下面是日志里的错误行"
            grep -n -m 20 -E 'error:|Error [0-9]|fatal error' /tmp/build.log || true
            echo "---- 日志末尾 ----"
            tail -40 /tmp/build.log
            exit 1
          fi

          ls -lh out/arch/arm64/boot/Image

      - name: 产物自检
        run: |
          cd kernel
          echo "== Image 大小 =="
          ls -lh out/arch/arm64/boot/Image
          echo "== 内核版本串 =="
          strings out/arch/arm64/boot/Image | grep -m2 '^Linux version' || true
          echo "== 是否含 KernelSU（应为空）=="
          if strings out/arch/arm64/boot/Image | grep -qiE 'kernelsu|ksu_handle'; then
            echo "::warning::镜像里检测到 KernelSU 符号"
            strings out/arch/arm64/boot/Image | grep -iE 'kernelsu|ksu_handle' | head -3
          else
            echo "  无 KSU 符号"
          fi
          echo "== MGLRU 状态 =="
          grep -c '^CONFIG_LRU_GEN=y' out/.config || echo "  MGLRU 未启用"
          echo "== zram 可用压缩算法 =="
          grep -E '^CONFIG_CRYPTO_(LZ4|LZ4HC|ZSTD|LZO)' out/.config || true
          echo "== 关键项回显 =="
          grep -E 'INIT_ON_ALLOC|KALLSYMS_ALL|SCHEDSTATS|PELT_UTIL|LOCALVERSION' out/.config || true

      - name: 打包 AnyKernel3
        run: bash scripts/package-ak3.sh kernel "${{ inputs.branch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.branch }}
          path: |
            out/*.zip
            out/*.sha256
            kernel/out/arch/arm64/boot/Image
            kernel/out/System.map
          if-no-files-found: error
