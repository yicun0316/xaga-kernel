name: build-kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "内核分支（如 android12-5.10-2025-12）"
        required: true
        default: "android12-5.10-2025-12"
      apply_mglru:
        description: "应用 patches/mglru/*.patch（MGLRU 补丁，需先在本地解决冲突）"
        type: boolean
        default: false
      apply_bbr3:
        description: "替换为 BBRv3（面向 6.x，可能编不过，默认关）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 腾出磁盘（内核编译约需 25GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip rsync python3 device-tree-compiler lz4 xz-utils zstd cpio kmod \
            git curl binutils pahole \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          clang --version | head -1

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b "${{ inputs.branch }}" \
            https://github.com/ztc1997/android_gki_kernel_5.10_common.git kernel
          cd kernel && git log -1 --format='%h %s'

      - name: 应用 MGLRU 补丁
        if: ${{ inputs.apply_mglru }}
        run: |
          shopt -s nullglob
          ps=("$GITHUB_WORKSPACE"/patches/mglru/*.patch)
          if [ ${#ps[@]} -eq 0 ]; then
            echo "::error::patches/mglru 里没有补丁"
            exit 1
          fi
          cd kernel
          for p in "${ps[@]}"; do
            echo ">> 应用 $(basename "$p")"
            git am --3way "$p" || { echo "::error::补丁失败 $(basename "$p")"; exit 1; }
          done

      - name: 产前检查（确认原有功能仍在，绝不删功能）
        run: |
          cd kernel
          echo "== kcompressd =="
          grep -rn "kcompressd" mm/vmscan.c drivers/block/zram/ 2>/dev/null | head -5 || echo "  未找到（该分支可能早于 2025-10）"
          echo "== zstd =="
          ls crypto/zstd.c lib/zstd/ >/dev/null 2>&1 && echo "  有" || echo "  无"
          echo "== teo / ssg / schedhorizon =="
          ls drivers/cpuidle/governors/teo.c 2>/dev/null
          grep -rln "ssg" block/ drivers/block/ 2>/dev/null | head -3
          grep -rln "schedhorizon" kernel/sched/ 2>/dev/null | head -3
          echo "== defconfig =="
          ls arch/arm64/configs/gki_defconfig

      - name: 修改内核配置（只动十几个符号，不删功能）
        run: bash scripts/patch-config.sh kernel

      - name: BBRv3 替换
        if: ${{ inputs.apply_bbr3 }}
        run: bash scripts/patch-bbrv3.sh kernel

      # 这个 fork 里没有 build/ 子模块（build.sh 属于 kernel/build 仓库），
      # 所以不走 build/build.sh，直接用 make。
      - name: 编译
        run: |
          cd kernel
          export ARCH=arm64
          export LLVM=1 LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          make O=out gki_defconfig

          # 关掉 KMI 符号裁剪：TRIM_UNUSED_KSYMS 需要 build/abi 脚本生成白名单，
          # 没有 build.sh 时开着会裁掉 vendor 依赖的导出符号，导致 vendor_dlkm 的 .ko 加载失败。
          # 同时关掉 git 版本后缀，避免深克隆缺失导致的版本号异常。
          ./scripts/config --file out/.config -d TRIM_UNUSED_KSYMS -d LOCALVERSION_AUTO
          make O=out olddefconfig

          make O=out -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image

      - name: 打包 AnyKernel3
        run: bash scripts/package-ak3.sh kernel "${{ inputs.branch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.branch }}
          path: |
            out/*.zip
            out/*.sha256
            kernel/out/arch/arm64/boot/Image
            kernel/out/System.map
          if-no-files-found: error
